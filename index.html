<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="registration-card">
    <p class="eyebrow">STUDENT PORTAL</p>
    <h1>Student Registration</h1>
    <p class="instructions">Complete the form to register your details.</p>

    <form id="registrationForm" novalidate>
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name">
          <small class="error" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com">
          <small class="error" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" maxlength="10" placeholder="10-digit phone number">
          <small class="error" id="phoneError"></small>
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob">
          <small class="error" id="dobError"></small>
        </div>

        <div class="form-group">
          <label for="course">Course</label>
          <select id="course">
            <option value="">Select a course</option>
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="BCom">B.Com</option>
            <option value="MBA">MBA</option>
          </select>
          <small class="error" id="courseError"></small>
        </div>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <div class="gender-options">
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <small class="error" id="genderError"></small>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" rows="4" placeholder="Enter your complete address"></textarea>
        <small class="error" id="addressError"></small>
      </div>

      <button type="submit">Submit Registration</button>
      <p id="successMessage"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
